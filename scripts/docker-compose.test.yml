services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: blockscout_test
      POSTGRES_USER: blockscout
      POSTGRES_PASSWORD: testpassword
    ports:
      - "7433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blockscout -d blockscout_test"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-db:
    image: redis:alpine
    ports:
      - "6380:6379"
